<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPD::ONE KICK Footstand</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: en stor 3D-scene med verktøylinje under; tittel og mål i toppen. */
:root {
  --bg: #e7eaed;
  --stage: #f4f6f8;
  --fg: #1b2127;
  --muted: #5b6670;
  --line: #c9d0d6;
  --ctl: #ffffff;
  --ctl-on: #1b2127;
  --ctl-on-fg: #f4f6f8;
  --focus: #2a6df4;
  --c-pedal: #c8e62a;
  --c-plate: #4a90d9;
  --c-cradle: #e0a030;
  --c-hook: #e5484d;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --stage: #1a2026; --fg: #e8ecef; --muted: #9aa5ae; --line: #2c353d;
    --ctl: #20272e; --ctl-on: #e8ecef; --ctl-on-fg: #12161a; --focus: #7aa7ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --stage: #1a2026; --fg: #e8ecef; --muted: #9aa5ae; --line: #2c353d;
  --ctl: #20272e; --ctl-on: #e8ecef; --ctl-on-fg: #12161a; --focus: #7aa7ff; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
#stage { flex: 1; min-height: 300px; position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: .75rem; color: var(--muted); pointer-events: none; }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 20px; align-items: start; }
.grp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .tog {
  font: 500 .9rem var(--font-body); color: var(--fg); background: var(--ctl); border: 1px solid var(--line);
  border-radius: 3px; padding: 7px 11px; cursor: pointer; min-height: 36px;
}
.seg button[aria-pressed="true"], .tog[aria-pressed="true"] { background: var(--ctl-on); color: var(--ctl-on-fg); border-color: var(--ctl-on); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--focus); min-height: 36px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
@media (max-width: 520px) { h1 { font-size: 1.4rem; } .seg button { flex: 1 1 auto; } }
</style></head><body>

<header>
  <h1>SPD::ONE KICK Footstand</h1>
  <p class="sub">Holder 151 × 182 × 38 mm &nbsp;·&nbsp; hælplate 151 × 190 × 19 mm &nbsp;·&nbsp; v4b (målt pedal 160 mm, tunge under gul kant)</p>
</header>

<div id="stage"><div class="hint">Dra for å dreie · klyp eller rull for å zoome · to fingre for å flytte</div></div>

<section class="panel" aria-label="Visningsvalg">
  <div class="grp">
    <span class="lbl">Vis</span>
    <div class="seg" id="mode">
      <button type="button" data-mode="all" aria-pressed="true">Samlet</button>
      <button type="button" data-mode="stand" aria-pressed="false">Footstand</button>
      <button type="button" data-mode="pedal" aria-pressed="false">Pedal</button>
    </div>
  </div>
  <div class="grp">
    <label class="lbl" for="explode">Eksplodert</label>
    <input id="explode" type="range" min="0" max="100" value="0">
  </div>
  <div class="grp">
    <span class="lbl">Fastholding</span>
    <button type="button" class="tog" id="hooks" aria-pressed="false">Marker bakre stopp og snaplist</button>
  </div>
  <div class="grp">
    <span class="lbl">Kamera</span>
    <div class="seg" id="views">
      <button type="button" data-view="heel">Hælside</button>
      <button type="button" data-view="back">Bakfra</button>
      <button type="button" data-view="side">Venstre side</button>
      <button type="button" data-view="top">Ovenfra</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">Deler</span>
    <div class="legend">
      <span><i style="background:var(--c-pedal)"></i>Pedal (forenklet)</span>
      <span><i style="background:var(--c-cradle)"></i>Holder</span>
      <span><i style="background:var(--c-plate)"></i>Hælplate</span>
      <span><i style="background:var(--c-hook)"></i>Festepunkter</span>
    </div>
  </div>
</section>
